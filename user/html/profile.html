<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile | Crustify</title>
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/auth.css">
  <style>
    .profile-section {
      max-width: 820px;
      margin: 60px auto 80px;
      padding: 0 20px;
    }

    /* Card wrapper */
    .profile-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px;
      padding: 32px 36px;
      margin-bottom: 26px;
    }

    /* Card heading row — title + action button side by side */
    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      margin-bottom: 22px;
      border-bottom: 1px solid #2a2a2a;
    }

    .card-heading h2 {
      color: #fff;
      font-size: 18px;
      margin: 0;
    }

    /* Edit / Save / Cancel buttons beside the heading */
    .head-btn {
      padding: 7px 18px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .head-btn:hover { opacity: 0.85; }
    .btn-edit-head   { background: #2980b9; color: #fff; }
    .btn-save-head   { background: #27ae60; color: #fff; }
    .btn-cancel-head { background: #444;    color: #ccc; margin-right: 8px; }

    /* Logout sits inline with the heading */
    .logout-inline {
      background: linear-gradient(135deg, #b11206, #e53935);
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .logout-inline:hover { opacity: 0.85; }

    /* Profile info rows (view mode) */
    .info-row {
      display: flex;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid #1e1e1e;
      gap: 12px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: 90px;
      flex-shrink: 0;
    }
    .info-value {
      color: #ddd;
      font-size: 15px;
    }

    /* Edit form (hidden by default) */
    .edit-form { display: none; }
    .edit-form .form-group { margin-bottom: 16px; }
    .edit-form label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .edit-form input {
      width: 100%;
      padding: 11px 14px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }
    .edit-form input:focus  { border-color: #c0392b; }
    .edit-form input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Order history */
    .order-row {
      background: #0e0e0e;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .order-row:last-child { margin-bottom: 0; }
    .order-row-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .order-row h4   { color: #fff; margin: 0 0 5px; font-size: 15px; }
    .order-row .meta { color: #666; font-size: 12px; margin: 3px 0; }
    .order-row .items-text { color: #aaa; font-size: 13px; margin: 4px 0 0; }
    .order-total { color: #fff; font-size: 17px; font-weight: bold; }

    .status-badge {
      display: inline-block;
      padding: 3px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 5px;
    }
    .status-confirmed  { background: rgba(46,204,113,0.15);  color: #2ecc71; border:1px solid #2ecc71; }
    .status-pending    { background: rgba(241,196,15,0.15);   color: #f1c40f; border:1px solid #f1c40f; }
    .status-preparing  { background: rgba(52,152,219,0.15);   color: #3498db; border:1px solid #3498db; }
    .status-delivered  { background: rgba(39,174,96,0.15);    color: #27ae60; border:1px solid #27ae60; }
    .status-cancelled  { background: rgba(231,76,60,0.15);    color: #e74c3c; border:1px solid #e74c3c; }

    .save-msg {
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
    }
.save-msg.ok  { color: #2ecc71; }
      .save-msg.err { color: #ff6b6b; }

      /* ── Responsive ─────────────────────────────────────────────── */
      @media (max-width: 560px) {
        .profile-section {
          margin: 32px auto 50px;
          padding: 0 14px;
        }
        .profile-card { padding: 22px 18px; border-radius: 14px; }

        /* Let the heading actions wrap under the title rather than
           squeezing four buttons into one narrow row. */
        .card-heading { flex-wrap: wrap; gap: 10px; }
        .head-btn, .logout-inline { padding: 9px 14px; }

        /* Stack the label above the value on narrow screens */
        .info-row { flex-direction: column; align-items: flex-start; gap: 3px; }
        .info-label { width: auto; }
        .info-value { font-size: 14px; word-break: break-word; }

        .edit-form input { padding: 13px 14px; font-size: 16px; }  /* 16px stops iOS zoom */
        .order-row { padding: 14px 15px; }
        .order-total { font-size: 15px; }
      }

      @media (max-width: 400px) {
        .profile-card { padding: 18px 14px; }
        .card-heading h2 { font-size: 17px; }
        .head-btn, .logout-inline { padding: 10px 12px; font-size: 12px; }
        .btn-cancel-head { margin-right: 4px; }
        .order-row h4 { font-size: 14px; }
        .order-total { font-size: 14px; }
      }
    </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="profile-section">

    <!-- ── My Profile card ───────────────────────────────────────── -->
    <div class="profile-card">
      <div class="card-heading">
        <h2>👤 My Profile</h2>
        <div>
          <!-- Edit / Save / Cancel toggle -->
          <span id="editActions">
            <button class="head-btn btn-edit-head" onclick="startEdit()">✏️ Edit</button>
          </span>
          <!-- Logout sits right beside the heading -->
          <button class="logout-inline" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- View mode -->
      <div id="viewMode">
        <div class="info-row">
          <span class="info-label">Name</span>
          <span class="info-value" id="viewName">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Email</span>
          <span class="info-value" id="viewEmail">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Phone</span>
          <span class="info-value" id="viewPhone">—</span>
        </div>
      </div>

      <!-- Edit mode (hidden until Edit clicked) -->
      <div class="edit-form" id="editMode">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="editName" placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email <small style="color:#555;">(cannot be changed)</small></label>
          <input type="email" id="editEmail" disabled>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="editPhone" placeholder="+91 9876543210">
        </div>
        <p class="save-msg" id="saveMsg"></p>
      </div>
    </div>

    <!-- ── Order History card ─────────────────────────────────────── -->
    <div class="profile-card">
      <div class="card-heading">
        <h2>📦 Order History</h2>
      </div>
      <div id="orderHistory">
        <p style="color:#555;">Loading orders...</p>
      </div>
    </div>

  </div>

  <script src="../javaScript/config.js"></script>
  <script>
    if (!isLoggedIn()) window.location.href = "login.html";

    const user = getUser();

    // Populate view mode
    function populateView(u) {
      document.getElementById("viewName").textContent  = u.name  || "—";
      document.getElementById("viewEmail").textContent = u.email || "—";
      document.getElementById("viewPhone").textContent = u.phone || "Not set";
    }

    if (user) populateView(user);

    // Load navbar
    fetch("navbar.html")
      .then(r => r.text())
      .then(d => {
        document.getElementById("navbar").innerHTML = d;
        updateNavbar();
      });

    // ── Edit mode toggle ──────────────────────────────────────────────
    function startEdit() {
      const u = getUser();
      document.getElementById("editName").value  = u.name  || "";
      document.getElementById("editEmail").value = u.email || "";
      document.getElementById("editPhone").value = u.phone || "";
      document.getElementById("saveMsg").textContent = "";

      document.getElementById("viewMode").style.display  = "none";
      document.getElementById("editMode").style.display  = "block";
      document.getElementById("editActions").innerHTML = `
        <button class="head-btn btn-cancel-head" onclick="cancelEdit()">Cancel</button>
        <button class="head-btn btn-save-head"   onclick="saveProfile()">Save</button>
      `;
    }

    function cancelEdit() {
      document.getElementById("viewMode").style.display  = "block";
      document.getElementById("editMode").style.display  = "none";
      document.getElementById("editActions").innerHTML =
        `<button class="head-btn btn-edit-head" onclick="startEdit()">✏️ Edit</button>`;
    }

    // ── Save profile via API ──────────────────────────────────────────
    async function saveProfile() {
      const name  = document.getElementById("editName").value.trim();
      const phone = document.getElementById("editPhone").value.trim();
      const msg   = document.getElementById("saveMsg");

      if (!name) { msg.className = "save-msg err"; msg.textContent = "Name cannot be empty."; return; }

      try {
        const res  = await fetch(`${API_URL}/auth/profile`, {
          method:  "PUT",
          headers: authHeaders(),
          body:    JSON.stringify({ name, phone }),
        });
        const data = await res.json();

        if (!res.ok) { msg.className = "save-msg err"; msg.textContent = data.message; return; }

        // Update localStorage with new name/phone
        const updated = { ...getUser(), name: data.name, phone: data.phone };
        localStorage.setItem("user", JSON.stringify(updated));

        populateView(updated);
        cancelEdit();

      } catch (err) {
        msg.className = "save-msg err";
        msg.textContent = "Network error. Is the server running?";
      }
    }

    // ── Order History ─────────────────────────────────────────────────
    async function loadOrders() {
      const box = document.getElementById("orderHistory");
      try {
        const res    = await fetch(`${API_URL}/orders`, { headers: authHeaders() });
        const orders = await res.json();

        if (!res.ok) { box.innerHTML = `<p style="color:#ff6b6b;">${orders.message}</p>`; return; }

        if (orders.length === 0) {
          box.innerHTML = `<p style="color:#555;">No orders yet. <a href="menu.html" style="color:#e74c3c;">Browse menu</a></p>`;
          return;
        }

        box.innerHTML = orders.map(o => `
          <div class="order-row">
            <div class="order-row-inner">
              <div>
                <h4>Order #${o._id.slice(-6).toUpperCase()}</h4>
                <p class="meta">${new Date(o.createdAt).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}</p>
                <p class="items-text">${o.items.map(i => `${i.name} ×${i.qty}`).join(" &bull; ")}</p>
              </div>
              <div style="text-align:right;">
                <div class="order-total">₹${o.total}</div>
                <span class="status-badge status-${o.status}">${o.status}</span>
              </div>
            </div>
          </div>
        `).join("");

      } catch (err) {
        box.innerHTML = `<p style="color:#ff6b6b;">Error: ${err.message}</p>`;
      }
    }

    loadOrders();
  </script>

</body>
</html>
