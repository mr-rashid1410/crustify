<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Crustify</title>
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <section class="auth-section">
    <div class="auth-box">

      <h2>Welcome Back 🍕</h2>
      <p class="subtitle">Login to your Crustify account</p>

      <!-- Error / Success message -->
      <div class="msg-box" id="msgBox"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="auth-btn" id="loginBtn">Login</button>
      </form>

      <hr class="divider">

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </p>

    </div>
  </section>

  <!-- Navbar load -->
  <script src="../javaScript/config.js"></script>
  <script>
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
        updateNavbar();
      });

    // If already logged in, redirect to menu
    if (isLoggedIn()) {
      window.location.href = "menu.html";
    }

    const form   = document.getElementById("loginForm");
    const msgBox = document.getElementById("msgBox");
    const btn    = document.getElementById("loginBtn");

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className   = `msg-box ${type} show`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled    = true;
      btn.textContent = "Logging in...";

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res  = await fetch(`${API_URL}/auth/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          // Show error from server (e.g., "No account found...")
          showMsg(data.message, "error");
          btn.disabled    = false;
          btn.textContent = "Login";
          return;
        }

        // Save token and user info to localStorage
        localStorage.setItem("token", data.token);
        localStorage.setItem("user",  JSON.stringify(data.user));

        showMsg("Login successful! Redirecting...", "success");

        // Redirect: admin goes to admin panel, user goes to menu
        setTimeout(() => {
          if (data.user.role === "admin") {
            window.location.href = "../../backend/dashboard.html";
          } else {
            window.location.href = "menu.html";
          }
        }, 800);

      } catch (err) {
        showMsg("Network error. Is the server running?", "error");
        btn.disabled    = false;
        btn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
