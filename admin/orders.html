<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders | Crustify Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="has-sidebar">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h2>🔥 Crustify</h2>
      <p>Admin Panel</p>
    </div>
    <nav>
      <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
      <a href="products.html"><span class="icon">🍕</span> Products</a>
      <a href="categories.html"><span class="icon">🏷️</span> Categories</a>
      <a href="orders.html" class="active"><span class="icon">📦</span> Orders</a>
      <a href="users.html"><span class="icon">👥</span> Users</a>
      <a href="contacts.html"><span class="icon">✉️</span> Enquiries</a>
    </nav>
    <div class="sidebar-footer">
      <a onclick="adminLogout()">🚪 Logout</a>
    </div>
  </aside>

  <!-- Tap outside to dismiss the drawer on small screens -->
  <div class="sidebar-backdrop" hidden></div>

  <!-- Main -->
  <main class="main">
    <!-- Drawer trigger: hidden on desktop, shown below 992px -->
    <button class="sidebar-toggle" aria-label="Open navigation menu" aria-expanded="false">
      <span class="icon" aria-hidden="true">&#9776;</span> Menu
    </button>
    <h1 class="page-title">Orders</h1>
    <p class="page-subtitle">View and manage all customer orders</p>

    <div class="card">
      <div class="card-header">
        <h3>All Orders</h3>
        <input class="search-input" id="searchInput" type="text" placeholder="Search by name or ID...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
              <th>Update Status</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="7" style="color:#666;text-align:center;padding:20px;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Order Detail Modal -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal" style="max-width:560px;">
      <h3>Order Details</h3>
      <div id="orderDetailContent"></div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAdmin();

    let allOrders = [];

    // ── Load all orders ────────────────────────────────────────────────
    async function loadOrders() {
      const tbody = document.getElementById("ordersBody");
      try {
        const res = await fetch(`${API_URL}/orders/admin/all`, { headers: adminHeaders() });
        allOrders = await res.json();

        if (!res.ok || allOrders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="color:#666;text-align:center;padding:20px;">No orders yet.</td></tr>`;
          return;
        }

        renderOrders(allOrders);

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="color:#ff6b6b;">Error: ${err.message}</td></tr>`;
      }
    }

    // ── Render rows ────────────────────────────────────────────────────
    function renderOrders(orders) {
      const tbody = document.getElementById("ordersBody");

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td>
            <a href="#" onclick="showDetail('${o._id}')" style="color:#e74c3c;font-family:monospace;text-decoration:none;">
              #${o._id.slice(-6).toUpperCase()}
            </a>
          </td>
          <td style="color:#fff;">${o.billingDetails.name}</td>
          <td style="color:#888;">${o.items.map(i => `${i.name} x${i.qty}`).join(", ")}</td>
          <td style="font-weight:bold;color:#fff;">₹${o.total}</td>
          <td><span class="badge badge-${o.status}">${o.status}</span></td>
          <td style="color:#666;">${new Date(o.createdAt).toLocaleDateString("en-IN")}</td>
          <td>
            <select class="status-select" onchange="updateStatus('${o._id}', this.value)">
              <option value="pending"    ${o.status==="pending"    ? "selected" : ""}>Pending</option>
              <option value="confirmed"  ${o.status==="confirmed"  ? "selected" : ""}>Confirmed</option>
              <option value="preparing"  ${o.status==="preparing"  ? "selected" : ""}>Preparing</option>
              <option value="delivered"  ${o.status==="delivered"  ? "selected" : ""}>Delivered</option>
              <option value="cancelled"  ${o.status==="cancelled"  ? "selected" : ""}>Cancelled</option>
            </select>
          </td>
        </tr>
      `).join("");
    }

    // ── Update order status ────────────────────────────────────────────
    async function updateStatus(orderId, status) {
      try {
        const res = await fetch(`${API_URL}/orders/${orderId}/status`, {
          method:  "PUT",
          headers: adminHeaders(),
          body:    JSON.stringify({ status }),
        });
        const data = await res.json();

        if (!res.ok) { showToast(data.message, "error"); return; }
        showToast(`Status updated to "${status}"`, "success");
        loadOrders(); // refresh

      } catch (err) {
        showToast("Error: " + err.message, "error");
      }
    }

    // ── Show order detail modal ────────────────────────────────────────
    function showDetail(orderId) {
      const order = allOrders.find(o => o._id === orderId);
      if (!order) return;

      const b = order.billingDetails;
      document.getElementById("orderDetailContent").innerHTML = `
        <p style="color:#888;margin-bottom:16px;font-family:monospace;">
          Order ID: #${order._id.slice(-6).toUpperCase()}
        </p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
          <div>
            <p style="color:#666;font-size:12px;margin-bottom:6px;">CUSTOMER</p>
            <p style="color:#fff;">${b.name}</p>
            <p style="color:#aaa;font-size:13px;">${b.email}</p>
            <p style="color:#aaa;font-size:13px;">${b.phone}</p>
          </div>
          <div>
            <p style="color:#666;font-size:12px;margin-bottom:6px;">DELIVERY ADDRESS</p>
            <p style="color:#fff;">${b.address}</p>
            <p style="color:#aaa;font-size:13px;">${b.city} — ${b.pincode}</p>
          </div>
        </div>

        <p style="color:#666;font-size:12px;margin-bottom:10px;">ORDER ITEMS</p>
        ${order.items.map(i => `
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;">
            <span style="color:#ccc;">${i.name} × ${i.qty}</span>
            <span style="color:#fff;">₹${i.price * i.qty}</span>
          </div>
        `).join("")}

        <div style="margin-top:16px;text-align:right;">
          <p style="color:#888;">Subtotal: ₹${order.subtotal}</p>
          <p style="color:#888;">Tax: ₹${order.tax}</p>
          <p style="color:#fff;font-size:18px;font-weight:bold;margin-top:6px;">Total: ₹${order.total}</p>
        </div>
      `;

      document.getElementById("orderModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("orderModal").classList.remove("open");
    }

    // ── Search / filter ────────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("searchInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = allOrders.filter(o =>
          o.billingDetails.name.toLowerCase().includes(q) ||
          o._id.toLowerCase().includes(q)
        );
        renderOrders(filtered);
      });
    });

    loadOrders();
  </script>

</body>
</html>
