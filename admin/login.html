<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | Crustify</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-login-wrap">
    <div class="admin-login-box">
      <h2>🍕 Admin Panel</h2>
      <p>Sign in with your admin credentials</p>

      <div id="msg"></div>

      <input type="email"    id="email"    placeholder="Admin Email">
      <div class="pw-field">
        <input type="password" id="password" placeholder="Password">
        <button type="button" class="pw-toggle" data-pw-toggle
                aria-label="Show password" aria-pressed="false">
          <svg class="pw-eye" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg class="pw-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.4 18.4 0 0 1 5.06-5.94" />
            <path d="M9.9 4.24A9.05 9.05 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19" />
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
      </div>
      <button id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // If already logged in as admin, go to dashboard
    if (isAdminLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    async function doLogin() {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn      = document.getElementById("loginBtn");
      const msg      = document.getElementById("msg");

      msg.className = "";
      msg.textContent = "";

      if (!email || !password) {
        msg.className   = "msg error";
        msg.textContent = "Please enter email and password.";
        return;
      }

      btn.disabled    = true;
      btn.textContent = "Signing in...";

      try {
        const res  = await fetch(`${API_URL}/auth/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          msg.className   = "msg error";
          msg.textContent = data.message;
          btn.disabled    = false;
          btn.textContent = "Sign In";
          return;
        }

        if (data.user.role !== "admin") {
          msg.className   = "msg error";
          msg.textContent = "Access denied. This account is not an admin.";
          btn.disabled    = false;
          btn.textContent = "Sign In";
          return;
        }

        // Save admin credentials
        localStorage.setItem("adminToken", data.token);
        localStorage.setItem("adminUser",  JSON.stringify(data.user));

        msg.className   = "msg success";
        msg.textContent = "Login successful! Redirecting...";

        setTimeout(() => window.location.href = "dashboard.html", 700);

      } catch (err) {
        msg.className   = "msg error";
        msg.textContent = "Network error. Is the server running?";
        btn.disabled    = false;
        btn.textContent = "Sign In";
      }
    }

    // Allow pressing Enter to submit
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>

</body>
</html>
